<!DOCTYPE html>

<html lang="it">

<head>
    <!-- Encoding dei Caratteri: garantisce il corretto rendering dei caratteri accentati (es. a, e, o) -->
    <meta charset="UTF-8">

    <!-- Viewport responsive: scala la pagina al 100% della larghezza dello schermo del dispositivo (mobile/desktop) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Meta Description: testo di anteprima mostrato da Google nei risultati di ricerca sotto il titolo della pagina -->
    <meta name="description" content="PeSCA studio - Dott.ssa Nadia Bandera, Psicologa, Analista del Comportamento e Supervisore ABA.">
    
    <!-- Titolo visibile nella scheda del browser e nei preferiti -->
    <title>PeSCA studio | Dott.ssa Nadia Bandera - Analista del Comportamento ABA</title>

    <!-- Collegamento al foglio di stile CSS globale -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Icona mostrata nella scheda del browser e nei preferiti. -->
    <link rel="icon" type="image/png" href="assets/icon.svg">
</head>

<body>

  <!-- Header modulare: Jekyll inserisce logo e barra di navigazione durante la build. -->
  {% include header.html %}

    <!-- Contenitore principale dei contenuti di valore (tag semantico HTML5) -->
    <main>

      <!-- Modulo Hero: schermata principale di copertina -->
      {% include hero.html %}
      
      <!-- Modulo Chi Sono: presentazione biografica e credenziali professionali -->
      {% include chi-sono.html %}

      <!-- Modulo Percorsi: servizi, trattamenti e interventi ABA -->
      {% include percorsi.html %}

      <!-- Modulo Contatti: form, mappa e dati dello studio -->
      {% include contatti.html %}

    </main>

  <!-- Footer modulare: Jekyll inserisce copyright, note legali, P.IVA e contatti rapidi. -->
  {% include footer.html %}

  <!-- Gestisce dinamicamente l'indicatore del menu mobile scorrevole. -->
  <script src="js/navigation.js"></script>

</body>
</html>
