<!-- Sezione Contatti con layout a 3 schede simmetriche -->
<section id="contatti" class="contact-section">
  <div class="container">
    
    <!-- Intestazione della sezione: Titolo principale H2 e sottotitolo descrittivo -->
    <div class="contact-header">
      <h2>Contatti e Sede</h2>
    </div>

    <!-- Griglia responsive per disporre le 3 schede su colonne affiancate -->
    <div class="contact-cards-wrapper">
      
      <!-- SCHEDA 1: Email diretta (Colore tematico Pesca per evidenziare la Call to Action) -->
      <article class="info-card info-card-pesca">
        <div class="info-icon" aria-hidden="true">
          <!-- SVG Vettoriale: Icona Busta Email -->
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="20" height="16" x="2" y="4" rx="2"/>
            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
          </svg>
        </div>
        <div class="info-text">
          <h3>Scrivi allo Studio</h3>
          <p>Per informazioni o un primo colloquio:</p>
          <!-- Protocollo mailto: apre il client di posta predefinito dell'utente -->
          <a href="mailto:info@pescastudio.it" class="contact-email-link">info@pescastudio.it</a>
        </div>
      </article>


      <!-- SCHEDA 2: Sede fisica (Colore tematico Blu) -->
      <article class="info-card info-card-blue">
        <div class="info-icon" aria-hidden="true">
          <!-- SVG Vettoriale: Icona Pin di localizzazione -->
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/>
            <circle cx="12" cy="10" r="3"/>
          </svg>
        </div>
        <div class="info-text">
          <h3>Terapie in Studio</h3>
          <p>Attività e trattamenti individuali in sede:</p>
          <!-- Link esterno: target="_blank" apre la mappa in nuova scheda, rel="noopener noreferrer" previene falle di sicurezza -->
          <a href="https://maps.google.com/?q=Via+San+Polo+264+25124+Brescia" target="_blank" rel="noopener noreferrer" class="map-link" aria-label="Via San Polo 264, Brescia, apri la sede su Google Maps in una nuova scheda">
            Via San Polo 264, Brescia ↗
          </a>
        </div>
      </article>

      <!-- SCHEDA 3: Operatività territoriale (Colore tematico Verde) -->
      <article class="info-card info-card-green">
        <!-- aria-hidden="true" nasconde l'icona ai lettori di schermo per evitare letture ridondanti -->
        <div class="info-icon" aria-hidden="true">
          <!-- SVG Vettoriale: Icona Mappa -->
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/>
            <line x1="8" y1="2" x2="8" y2="18"/>
            <line x1="16" y1="6" x2="16" y2="22"/>
          </svg>
        </div>
        <div class="info-text">
          <h3>Attività sul Territorio</h3>
          <p>Consulenze, sostegno genitoriale e supporto scolastico:</p>
          <p><span class="highlight-location">Brescia e provincia</span></p>
        </div>
      </article>

    </div>

  </div>
</section>
